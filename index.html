<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>xiao</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f5f6f8;
      font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .player-container {
      max-width: 1300px;
      width: 100%;
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .hero {
      background: #ffffff;
      padding: 0.8rem 0.8rem;
      border-bottom: 1px solid #e8eaed;
      text-align: center;
    }

    .img1 {
      width: 70px;
      height: 70px;
      text-align: left;
    }

    .sub {
      color: #5f6368;
      margin-top: 0.8rem;
      font-size: 2.5rem;
      opacity: 0.9;
    }

    .control-panel {
      padding: 1rem 2rem 1.2rem;
      background: #fafbfc;
      border-bottom: 1px solid #e8eaed;
    }

    .control-panel .interface-selector {
      display: none;
    }

    .label-style {
      display: block;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #5f6368;
      margin-bottom: 0.6rem;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 0.5rem;
      align-items: center;
    }

    .url-input-wrapper {
      flex: 4;
      min-width: 200px;
    }

    .url-input {
      width: 100%;
      background: #ffffff;
      border: 7px solid #dadce0;
      border-radius: 0.75rem;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      color: #202124;
      transition: all 0.2s;
      font-family: monospace;
    }

    .url-input:focus {
      outline: none;
      border-color: #1a73e8;
      background: #ffffff;
      box-shadow: 0 0 0 7px rgba(26, 115, 232, 0.15);
    }

    .url-input::placeholder {
      color: #9aa0a6;
      font-family: system-ui;
    }

    .btn-primary {
      background: #1a73e8;
      border: none;
      border-radius: 0.75rem;
      padding: 0.85rem 1.8rem;
      font-weight: 700;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn-primary:hover {
      background: #1557b0;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
      background: #174ea6;
    }

    .examples {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
    }

    .example-badge {
      background: #f1f3f4;
      border-radius: 0.5rem;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      color: #5f6368;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid #dadce0;
      text-decoration: none;
    }

    .example-badge:hover {
      background: #e8eaed;
      color: #202124;
      border-color: #bdc1c6;
    }

    .info-note {
      font-size: 0.75rem;
      color: #80868b;
      margin-left: auto;
    }

    .player-area {
      padding: 0 0.8rem 1rem 0.8rem;
      position: relative;
    }

    .video-frame-wrapper {
      background: #000000;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e8eaed;
      aspect-ratio: 16 / 9;
      width: 100%;
      position: relative;
    }

    #videoFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
      display: block;
    }

    .bottom-interface-area {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0.1rem 0.5rem 0.2rem 0.5rem;
    }

    .interface-mini-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #ffffff;
      padding: 0.4rem 1rem 0.4rem 1.2rem;
      border-radius: 0.75rem;
      border: 1px solid #dadce0;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      transform: scale(0.9);
      transform-origin: right center;
      transition: transform 0.2s;
    }

    .interface-mini-selector:hover {
      transform: scale(0.93);
      border-color: #bdc1c6;
    }

    .mini-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #5f6368;
      white-space: nowrap;
      opacity: 0.9;
    }

    .custom-select-mini {
      background: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 0.5rem;
      padding: 0.4rem 2rem 0.4rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #202124;
      cursor: pointer;
      transition: all 0.2s;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235f6368' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
      background-repeat: no-repeat;
      background-position: right 0.6rem center;
      background-size: 14px;
      width: auto;
      min-width: 150px;
    }

    .custom-select-mini:hover {
      border-color: #bdc1c6;
      background-color: #f1f3f4;
    }

    .custom-select-mini:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }

    .status-text {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      text-align: center;
      color: #5f6368;
      background: #f8f9fa;
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 0.5rem;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      display: block;
    }

    footer {
      text-align: center;
      padding: 1rem 2rem 1.5rem;
      font-size: 0.75rem;
      color: #80868b;
      border-top: 1px solid #e8eaed;
      margin-top: 0.2rem;
    }

    @media (max-width: 680px) {
      .control-panel {
        padding: 1.2rem;
      }
      .hero h1 {
        font-size: 1.4rem;
      }
      .btn-primary {
        padding: 0.7rem 1.3rem;
      }
      .player-area {
        padding: 0 1rem 1.5rem;
      }
      .bottom-interface-area {
        justify-content: flex-end;
        padding-right: 0.2rem;
      }
      .interface-mini-selector {
        transform: scale(0.85);
        transform-origin: right center;
      }
      .custom-select-mini {
        min-width: 130px;
      }
    }
  </style>
</head>
<body>
<div class="player-container">
  <div class="hero">
    <img class="img1" src="https://wimg.588ku.com/gif320/24/07/09/5574462e73a248c2b7e73eb38364cf7d.gif" alt="logo">
    <div class="sub"></div>
    <div class="sub">平台通用API</div>
  </div>

  <div class="control-panel">
    <div class="url-input-wrapper" style="margin-top:0;">
      <label class="label-style" for="videoUrl">🔗 视频链接 / 影片名称 (支持URL或关键词)</label>
      <div class="input-group">
        <input type="text" id="videoUrl" class="url-input" placeholder="例如: https://v.qq.com/x/cover/xxx.html 或 搜索: 流浪地球2" value="">
        <button id="playBtn" class="btn-primary">▶ 立即播放</button>
      </div>
    </div>
    <div class="examples">
          <a class="example-badge" href="https://v.qq.com/">🔥 腾讯视频</a>
          <a class="example-badge" href="https://www.iqiyi.com/">🎬 爱奇艺热播</a>
          <a class="example-badge" href="https://www.bilibili.com/">📺 B站番剧</a>
          <a class="example-badge" href="https://v.youku.com/v_show/">🎥 优酷VIP</a>
          <span class="info-note">💡 点击示例快速填充 | 部分接口支持搜片名</span>
    </div>
  </div>

  <div class="player-area">
    <div class="video-frame-wrapper" id="frameWrapper">
      <iframe id="videoFrame" src="about:blank" title="视频解析播放器" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
    </div>

    <div class="bottom-interface-area">
      <div class="interface-mini-selector">
        <span class="mini-label">⚙️ 接口</span>
        <select class="custom-select-mini" id="jk" name="a">
          <option value="https://jx.xmflv.com/?url=" selected>默认API</option>
          <option value="//z1.m1907.top/?jx=">搜影片名称专用</option>
          <option value="https://jx.xmflv.cc/?url=">超清VIP视频解析</option>
          <option value="https://www.8090.la/8090/?url=">vip视频解析1</option>
          <option value="https://jx.m3u8.tv/jiexi/?url=">vip视频解析2</option>
          <option value="https://jx.parwix.com:4433/player/?url=">vip视频解析3</option>
          <option value="https://www.playm3u8.cn/jiexi.php?url=">playm3u8</option>
          <option value="https://jx.jsonplayer.com/player/?url=">综合/B站</option>
          <option value="https://www.ckplayer.vip/jiexi/?url=">vip视频解析6</option>
          <option value="https://www.pangujiexi.com/jiexi/?url=">vip视频解析7</option>
          <option value="http://api.apii.top/?v=">全能VIP解析通道</option>
          <option value="https://www.8090g.cn/?url=">8090</option>
          <option value="https://www.8090.la/8090/?url=">备用线路2</option>
          <option value="https://jx.playerjy.com/?url=">Player-JY</option>
          <option value="https://svip.bljiex.cc/?v=">备用线路4</option>
          <option value="https://yparse.ik9.cc/index.php?url=">备用线路5</option>
          <option value="https://jx.aidouer.net/?url=">爱豆</option>
          <option value="https://jx.yangtu.top/?url=">YT</option>
          <option value="https://jx.yparse.com/index.php?url=">yparse</option>
          <option value="https://www.pouyun.com/?url=">剖元</option>
          <option value="https://im1907.top/?jx=">m1907</option>
          <option value="https://www.yemu.xyz/?url=">夜幕</option>
          <option value="https://api.qianqi.net/vip/?url=">qianqi</option>
          <option value="https://jx.playerjy.com/?url=">备用线路6</option>
          <option value="http://jiexi44.qmbo.cn/jiexi/?url=">vip接口2（推荐）</option>
          <option value="https://z1.m1907.top/?jx=">vip接口3（可搜名称）</option>
          <option value="https://yemu.xyz/?url=">vip接口4</option>
        </select>
      </div>
    </div>

    <div id="statusMessage" class="status-text">✨ 选择API，输入视频地址后点击播放</div>
  </div>

  <footer>
    ⚡ 提示：解析接口来源于网络，仅供体验。如部分接口失效可切换线路，若影片需搜索名称请选用「搜影片名称专用」等接口。
    ⚡ 如遇广告请忽略
  </footer>
</div>

<script>
  (function() {
    const selectEl = document.getElementById('jk');
    const videoUrlInput = document.getElementById('videoUrl');
    const playBtn = document.getElementById('playBtn');
    const videoFrame = document.getElementById('videoFrame');
    const statusDiv = document.getElementById('statusMessage');

    function setStatus(message, isError = false) {
      statusDiv.innerHTML = message;
      statusDiv.style.color = isError ? '#d93025' : '#5f6368';
      statusDiv.style.background = isError ? '#fce8e6' : '#f8f9fa';
      setTimeout(() => {
        if (!isError && statusDiv.innerHTML === message) {
          statusDiv.style.color = '#5f6368';
          statusDiv.style.background = '#f8f9fa';
        } else if (isError && statusDiv.innerHTML === message) {
          setTimeout(() => {
            if(statusDiv.innerHTML === message) statusDiv.style.color = '#d93025';
          }, 3000);
        }
      }, 4000);
    }

    function buildAndPlay() {
      let rawInterface = selectEl.value;
      let videoInput = videoUrlInput.value.trim();

      if (!videoInput) {
        setStatus('❓ 请输入视频链接或影片名称（部分接口支持直接搜片名）', true);
        return;
      }

      let finalInterface = rawInterface;
      if (rawInterface.startsWith('//')) {
        finalInterface = window.location.protocol + rawInterface;
      }

      const encodedParam = encodeURIComponent(videoInput);
      let parserUrl = finalInterface + encodedParam;

      try {
        new URL(parserUrl);
      } catch (e) {
        setStatus('❌ 生成的解析地址无效，请检查接口配置或输入内容', true);
        return;
      }

      setStatus(`⏳ 正在通过「${selectEl.options[selectEl.selectedIndex]?.text || '解析接口'}」加载视频 ...`);
      videoFrame.src = parserUrl;

      const loadHandler = () => {
        setStatus(`✅ 已加载解析地址，等待视频响应。若长时间无画面可尝试切换接口`);
        videoFrame.removeEventListener('load', loadHandler);
        videoFrame.removeEventListener('error', errorHandler);
      };
      const errorHandler = () => {
        setStatus(`⚠️ 视频播放器加载出错，该接口可能失效或视频源限制，请更换接口重试`, true);
        videoFrame.removeEventListener('load', loadHandler);
        videoFrame.removeEventListener('error', errorHandler);
      };
      videoFrame.addEventListener('load', loadHandler, { once: true });
      videoFrame.addEventListener('error', errorHandler, { once: true });

      console.log(`[解析] 接口: ${finalInterface} , 完整地址: ${parserUrl}`);
    }

    function handlePlay() {
      buildAndPlay();
    }

    videoUrlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handlePlay();
      }
    });

    selectEl.addEventListener('change', () => {
      const selectedText = selectEl.options[selectEl.selectedIndex]?.text || '接口';
      setStatus(`🔁 已切换到「${selectedText}」接口，再次点击播放即可使用新线路`, false);

      if (selectedText && (selectedText.includes('搜影片名称') || selectedText.includes('可搜名称'))) {
        setTimeout(() => setStatus(`💡 当前接口「${selectedText}」支持直接输入电影/电视剧名称进行搜索`, false), 200);
      } else if (selectEl.value.includes('m1907') || selectEl.value.includes('z1.m1907')) {
        setTimeout(() => setStatus(`🎯 当前接口支持资源搜索，可尝试输入影视名称或视频链接`, false), 200);
      }
    });

    let pendingPlay = false;
    playBtn.onclick = () => {
      if (pendingPlay) return;
      pendingPlay = true;
      handlePlay();
      setTimeout(() => { pendingPlay = false; }, 800);
    };

    const urlParams = new URLSearchParams(window.location.search);
    const initialVideo = urlParams.get('video');
    if (initialVideo && initialVideo.trim() !== "") {
      videoUrlInput.value = decodeURIComponent(initialVideo);
      setStatus(`🔗 检测到url参数视频链接，自动解析播放`, false);
      setTimeout(() => {
        handlePlay();
      }, 400);
    }

    setTimeout(() => {
      setStatus('🎉 就绪！粘贴视频链接或使用示例，解析接口多达27条，自由切换');
    }, 600);

    window.__refreshPlayer = buildAndPlay;
  })();
</script>
</body>
</html>
