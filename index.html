<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>API平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f5f6f8;
      font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    /* 正常PC内容容器 */
    .player-container {
      max-width: 1300px;
      width: 100%;
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .hero {
      background: #ffffff;
      padding: 0.8rem 0.8rem;
      border-bottom: 1px solid #e8eaed;
      text-align: center;
    }

    .img1 {
      width: 70px;
      height: 70px;
      text-align: left;
    }

    .sub {
      color: #5f6368;
      margin-top: 0.8rem;
      font-size: 2.5rem;
      opacity: 0.9;
    }

    .control-panel {
      padding: 1rem 2rem 1.2rem;
      background: #fafbfc;
      border-bottom: 1px solid #e8eaed;
    }

    .label-style {
      display: block;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #5f6368;
      margin-bottom: 0.6rem;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 0.5rem;
      align-items: center;
    }

    .url-input-wrapper {
      flex: 4;
      min-width: 200px;
    }

    .url-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 0.75rem;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      color: #202124;
      transition: all 0.2s;
      font-family: monospace;
    }

    .url-input:focus {
      outline: none;
      border-color: #1a73e8;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
    }

    .url-input::placeholder {
      color: #9aa0a6;
      font-family: system-ui;
    }

    .btn-primary {
      background: #1a73e8;
      border: none;
      border-radius: 0.75rem;
      padding: 0.85rem 1.8rem;
      font-weight: 700;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn-primary:hover {
      background: #1557b0;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
      background: #174ea6;
    }

    .examples {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
    }

    .example-badge {
      background: #f1f3f4;
      border-radius: 0.5rem;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      color: #5f6368;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid #dadce0;
      text-decoration: none;
      display: inline-block;
    }

    .example-badge:hover {
      background: #e8eaed;
      color: #202124;
      border-color: #bdc1c6;
    }

    .info-note {
      font-size: 0.75rem;
      color: #80868b;
      margin-left: auto;
    }

    .player-area {
      padding: 0 0.8rem 1rem 0.8rem;
      position: relative;
    }

    .video-frame-wrapper {
      background: #000000;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e8eaed;
      aspect-ratio: 16 / 9;
      width: 100%;
      position: relative;
    }

    #videoFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
      display: block;
    }

    .bottom-interface-area {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0.1rem 0.5rem 0.2rem 0.5rem;
    }

    .interface-mini-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #ffffff;
      padding: 0.4rem 1rem 0.4rem 1.2rem;
      border-radius: 0.75rem;
      border: 1px solid #dadce0;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      transform: scale(0.9);
      transform-origin: right center;
      transition: transform 0.2s;
    }

    .interface-mini-selector:hover {
      transform: scale(0.93);
      border-color: #bdc1c6;
    }

    .mini-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #5f6368;
      white-space: nowrap;
      opacity: 0.9;
    }

    .custom-select-mini {
      background: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 0.5rem;
      padding: 0.4rem 2rem 0.4rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #202124;
      cursor: pointer;
      transition: all 0.2s;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235f6368' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
      background-repeat: no-repeat;
      background-position: right 0.6rem center;
      background-size: 14px;
      width: auto;
      min-width: 150px;
    }

    .custom-select-mini:hover {
      border-color: #bdc1c6;
      background-color: #f1f3f4;
    }

    .custom-select-mini:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }

    .status-text {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      text-align: center;
      color: #5f6368;
      background: #f8f9fa;
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 0.5rem;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    footer {
      text-align: center;
      padding: 1rem 2rem 1.5rem;
      font-size: 0.75rem;
      color: #80868b;
      border-top: 1px solid #e8eaed;
      margin-top: 0.2rem;
    }

    /* 移动端拦截遮罩层 */
    .mobile-blocker {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, #0b0f1c, #03060c);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
    }

    .blocker-card {
      background: rgba(20, 25, 40, 0.95);
      backdrop-filter: blur(16px);
      border-radius: 2.5rem;
      max-width: 90%;
      width: 460px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeInUp 0.4s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .blocker-icon {
      font-size: 4.5rem;
      margin-bottom: 1.2rem;
      display: inline-block;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    .blocker-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF, #A0B3FF);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.75rem;
    }

    .blocker-sub {
      font-size: 1rem;
      color: #cdd9ff;
      margin-bottom: 1.8rem;
      line-height: 1.4;
      font-weight: 500;
      opacity: 0.9;
    }

    .blocker-desc {
      font-size: 0.85rem;
      color: #9aa9cf;
      margin-bottom: 2rem;
      background: rgba(0,0,0,0.3);
      padding: 0.6rem 1rem;
      border-radius: 2rem;
      display: inline-block;
    }

    .blocker-note {
      font-size: 0.75rem;
      color: #6d7ba3;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 1.2rem;
      margin-top: 0.5rem;
    }

    @media (max-width: 680px) {
      .control-panel {
        padding: 1.2rem;
      }
      .hero h1 {
        font-size: 1.4rem;
      }
      .btn-primary {
        padding: 0.7rem 1.3rem;
      }
      .player-area {
        padding: 0 1rem 1.5rem;
      }
      .bottom-interface-area {
        justify-content: flex-end;
        padding-right: 0.2rem;
      }
      .interface-mini-selector {
        transform: scale(0.85);
        transform-origin: right center;
      }
      .custom-select-mini {
        min-width: 130px;
      }
    }
  </style>
</head>
<body>

<!-- 移动端拦截层（默认隐藏，仅移动端显示） -->
<div id="mobileBlocker" class="mobile-blocker" style="display: none;">
  <div class="blocker-card">
    <div class="blocker-icon">🖥️⛔</div>
    <div class="blocker-title">仅限电脑端访问</div>
    <div class="blocker-sub">当前设备为手机/平板</div>
    <div class="blocker-desc">wen提醒你:专为桌面端设计</div>
    <div class="blocker-note">User-Agent 检测 • 为了更好的播放兼容性</div>
  </div>
</div>

<!-- 正常的PC播放器容器 -->
<div class="player-container" id="playerContainer">
  <div class="hero">
    <img class="img1" src="https://wimg.588ku.com/gif320/24/07/09/5574462e73a248c2b7e73eb38364cf7d.gif" alt="logo">
    <div class="sub"></div>
    <div class="sub">平台通用API</div>
  </div>

  <div class="control-panel">
    <div class="url-input-wrapper" style="margin-top:0;">
      <label class="label-style" for="videoUrl">🔗 视频链接 / 影片名称 (支持URL或关键词)</label>
      <div class="input-group">
        <input type="text" id="videoUrl" class="url-input" placeholder="例如: https://v.qq.com/x/cover/xxx.html 或 搜索: 流浪地球2" value="">
        <button id="playBtn" class="btn-primary">▶ 立即播放</button>
      </div>
    </div>
    <div class="examples">
      <a class="example-badge" href="https://v.qq.com/">🔥 腾讯视频</a>
      <a class="example-badge" href="https://www.iqiyi.com/">🎬 爱奇艺</a>
      <a class="example-badge" href="https://www.bilibili.com/">📺 哔哩哔哩</a>
      <a class="example-badge" href="https://v.youku.com/">🎥 优酷</a>
      <span class="info-note">💡 点击示例快速填充 | 部分接口支持搜片名</span>
    </div>
  </div>

  <div class="player-area">
    <div class="video-frame-wrapper" id="frameWrapper">
      <iframe id="videoFrame" src="about:blank" title="视频解析播放器" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
    </div>

    <div class="bottom-interface-area">
      <div class="interface-mini-selector">
        <span class="mini-label">⚙️ 请选择接口</span>
        <select class="custom-select-mini" id="jk" name="a">
          <option value="https://jx.xmflv.com/?url=" selected>默认API</option>
          <option value="//z1.m1907.top/?jx=">搜影片名称专用</option>
          <option value="https://jx.xmflv.cc/?url=">超清VIP视频解析</option>
          <option value="https://www.8090.la/8090/?url=">vip视频解析1</option>
          <option value="https://jx.m3u8.tv/jiexi/?url=">vip视频解析2</option>
          <option value="https://jx.parwix.com:4433/player/?url=">vip视频解析3</option>
          <option value="https://www.playm3u8.cn/jiexi.php?url=">playm3u8</option>
          <option value="https://jx.jsonplayer.com/player/?url=">综合/B站</option>
          <option value="https://www.ckplayer.vip/jiexi/?url=">vip视频解析6</option>
          <option value="https://www.pangujiexi.com/jiexi/?url=">vip视频解析7</option>
          <option value="http://api.apii.top/?v=">全能VIP解析通道</option>
          <option value="https://www.8090g.cn/?url=">8090</option>
          <option value="https://www.8090.la/8090/?url=">备用线路2</option>
          <option value="https://jx.playerjy.com/?url=">Player-JY</option>
          <option value="https://svip.bljiex.cc/?v=">备用线路4</option>
          <option value="https://yparse.ik9.cc/index.php?url=">备用线路5</option>
          <option value="https://jx.yparse.com/index.php?url=">yparse</option>
          <option value="https://www.pouyun.com/?url=">剖元</option>
          <option value="https://im1907.top/?jx=">m1907</option>
          <option value="https://www.yemu.xyz/?url=">夜幕</option>
          <option value="https://api.qianqi.net/vip/?url=">qianqi</option>
          <option value="https://jx.playerjy.com/?url=">备用线路6</option>
          <option value="http://jiexi44.qmbo.cn/jiexi/?url=">vip接口2（推荐）</option>
          <option value="https://z1.m1907.top/?jx=">vip接口3（可搜名称）</option>
          <option value="https://yemu.xyz/?url=">vip接口4</option>
        </select>
      </div>
    </div>

    <div id="statusMessage" class="status-text">✨ 选择API，输入视频地址后点击播放</div>
  </div>

  <footer>
    ⚡ 提示：解析接口来源于网络，仅供体验。如部分接口失效可切换线路，若影片需搜索名称请选用「搜影片名称专用」等接口。
    ⚡ 如遇广告请忽略 · 请使用Windows/macOS/Linux等桌面设备访问
  </footer>
</div>

<script>
  (function() {
    // ==================== UA检测 ====================
    function isMobileDevice() {
      const ua = navigator.userAgent;

      // 移动设备特征检测
      const mobileRegex = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile|Tablet|PlayBook|Silk/i;

      // 检测iPad (iPadOS 13+ 会将iPad伪装成Mac，但仍有独特特征)
      const isIPad = /iPad/i.test(ua) ||
                     (/Macintosh/i.test(ua) && navigator.maxTouchPoints && navigator.maxTouchPoints > 1);

      // 检测安卓平板
      const isAndroidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);

      // 检测触摸屏且屏幕较小
      const isSmallTouch = /Touch/i.test(ua) && window.innerWidth <= 1024;

      const result = mobileRegex.test(ua) || isIPad || isAndroidTablet || isSmallTouch;

      // 调试输出（可在控制台查看）
      console.log('[UA检测] UserAgent:', ua);
      console.log('[UA检测] 是否移动设备:', result);
      console.log('[UA检测] 详细 - isIPad:', isIPad, 'isAndroidTablet:', isAndroidTablet);

      return result;
    }

    const isMobile = isMobileDevice();
    const blocker = document.getElementById('mobileBlocker');
    const playerContainer = document.getElementById('playerContainer');

    if (isMobile) {
      // 显示拦截遮罩
      if (blocker) {
        blocker.style.display = 'flex';
      }
      // 隐藏播放器内容（可选，但遮罩已覆盖）
      if (playerContainer) {
        playerContainer.style.opacity = '0.3';
        playerContainer.style.pointerEvents = 'none';
      }
      // 彻底禁用iframe加载
      const frame = document.getElementById('videoFrame');
      if (frame) frame.src = 'about:blank';

      // 禁用所有交互元素
      const interactiveElements = document.querySelectorAll('#videoUrl, #playBtn, #jk, .example-badge, .custom-select-mini');
      interactiveElements.forEach(el => {
        if (el) {
          el.disabled = true;
          el.style.pointerEvents = 'none';
          el.style.opacity = '0.5';
          if (el.tagName === 'INPUT') el.readOnly = true;
        }
      });

      // 修改状态文字
      const statusMsg = document.getElementById('statusMessage');
      if (statusMsg) {
        statusMsg.innerHTML = '🚫 访问受限：当前设备不支持';
        statusMsg.style.background = '#fce8e6';
        statusMsg.style.color = '#c5221f';
      }

      console.log('[访问限制] ，已拦截访问');
      return; // 终止执行，不绑定任何播放功能
    }

    // ==================== PC端正常逻辑 ====================
    console.log('[访问授权] ，正常加载播放器');

    // 确保播放器正常显示
    if (playerContainer) {
      playerContainer.style.opacity = '1';
      playerContainer.style.pointerEvents = 'auto';
    }

    const selectEl = document.getElementById('jk');
    const videoUrlInput = document.getElementById('videoUrl');
    const playBtn = document.getElementById('playBtn');
    const videoFrame = document.getElementById('videoFrame');
    const statusDiv = document.getElementById('statusMessage');

    function setStatus(message, isError = false) {
      statusDiv.innerHTML = message;
      statusDiv.style.color = isError ? '#d93025' : '#5f6368';
      statusDiv.style.background = isError ? '#fce8e6' : '#f8f9fa';
      setTimeout(() => {
        if (!isError && statusDiv.innerHTML === message) {
          statusDiv.style.color = '#5f6368';
          statusDiv.style.background = '#f8f9fa';
        }
      }, 4000);
    }

    function buildAndPlay() {
      let rawInterface = selectEl.value;
      let videoInput = videoUrlInput.value.trim();

      if (!videoInput) {
        setStatus('❓ 请输入视频链接或影片名称（部分接口支持直接搜片名）', true);
        return;
      }

      let finalInterface = rawInterface;
      if (rawInterface.startsWith('//')) {
        finalInterface = window.location.protocol + rawInterface;
      }

      const encodedParam = encodeURIComponent(videoInput);
      let parserUrl = finalInterface + encodedParam;

      try {
        new URL(parserUrl);
      } catch (e) {
        setStatus('❌ 生成的解析地址无效，请检查接口配置或输入内容', true);
        return;
      }

      setStatus(`⏳ 正在通过「${selectEl.options[selectEl.selectedIndex]?.text || '解析接口'}」加载视频 ...`);
      videoFrame.src = parserUrl;

      const loadHandler = () => {
        setStatus(`✅ 已加载解析地址，等待视频响应。若长时间无画面可尝试切换接口`);
        videoFrame.removeEventListener('load', loadHandler);
        videoFrame.removeEventListener('error', errorHandler);
      };
      const errorHandler = () => {
        setStatus(`⚠️ 视频播放器加载出错，该接口可能失效或视频源限制，请更换接口重试`, true);
        videoFrame.removeEventListener('load', loadHandler);
        videoFrame.removeEventListener('error', errorHandler);
      };
      videoFrame.addEventListener('load', loadHandler, { once: true });
      videoFrame.addEventListener('error', errorHandler, { once: true });

      console.log(`[解析] 接口: ${finalInterface} , 完整地址: ${parserUrl}`);
    }

    function handlePlay() {
      buildAndPlay();
    }

    videoUrlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handlePlay();
      }
    });

    selectEl.addEventListener('change', () => {
      const selectedText = selectEl.options[selectEl.selectedIndex]?.text || '接口';
      setStatus(`🔁 已切换到「${selectedText}」接口，再次点击播放即可使用新线路`, false);
    });

    playBtn.addEventListener('click', handlePlay);

    // 示例标签填充功能
    const exampleBadges = document.querySelectorAll('.example-badge[data-url]');
    exampleBadges.forEach(badge => {
      badge.addEventListener('click', (e) => {
        e.preventDefault();
        const url = badge.getAttribute('data-url');
        if(url) {
          videoUrlInput.value = url;
          setStatus(`已填充示例地址: ${url}，点击播放即可解析`, false);
        }
      });
    });

    setStatus('✨ 欢迎，电脑端已授权 | 选择API，输入视频地址后点击播放', false);
  })();
</script>
</body>
</html>
