<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>API平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      /* 不禁用全局文本选择，让用户可以复制文字（但不影响全局体验）*/
    }

    body {
      background-color: #f5f6f8;
      font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .player-container {
      max-width: 1300px;
      width: 100%;
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .hero {
      background: #ffffff;
      padding: 0.8rem 0.8rem;
      border-bottom: 1px solid #e8eaed;
      text-align: center;
    }

    .img1 {
      width: 70px;
      height: 70px;
      text-align: left;
    }

    .sub {
      color: #5f6368;
      margin-top: 0.8rem;
      font-size: 2.5rem;
      opacity: 0.9;
    }

    .control-panel {
      padding: 1rem 2rem 1.2rem;
      background: #fafbfc;
      border-bottom: 1px solid #e8eaed;
    }

    .label-style {
      display: block;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #5f6368;
      margin-bottom: 0.6rem;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 0.5rem;
      align-items: center;
    }

    .url-input-wrapper {
      flex: 4;
      min-width: 200px;
    }

    .url-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 0.75rem;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      color: #202124;
      transition: all 0.2s;
      font-family: monospace;
      user-select: text; /* 输入框允许选中和复制 */
    }

    .url-input:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
    }

    .url-input::placeholder {
      color: #9aa0a6;
      font-family: system-ui;
    }

    .btn-primary {
      background: #1a73e8;
      border: none;
      border-radius: 0.75rem;
      padding: 0.85rem 1.8rem;
      font-weight: 700;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn-primary:hover {
      background: #1557b0;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
      background: #174ea6;
    }

    .examples {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
    }

    .example-badge {
      background: #f1f3f4;
      border-radius: 0.5rem;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      color: #5f6368;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid #dadce0;
      text-decoration: none;
      display: inline-block;
    }

    .example-badge:hover {
      background: #e8eaed;
      color: #202124;
      border-color: #bdc1c6;
    }

    .info-note {
      font-size: 0.75rem;
      color: #80868b;
      margin-left: auto;
    }

    .player-area {
      padding: 0 0.8rem 1rem 0.8rem;
      position: relative;
    }

    .video-frame-wrapper {
      background: #000000;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e8eaed;
      aspect-ratio: 16 / 9;
      width: 100%;
      position: relative;
    }

    #videoFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
      display: block;
    }

    .bottom-interface-area {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0.1rem 0.5rem 0.2rem 0.5rem;
    }

    .interface-mini-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #ffffff;
      padding: 0.4rem 1rem 0.4rem 1.2rem;
      border-radius: 0.75rem;
      border: 1px solid #dadce0;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      transform: scale(0.9);
      transform-origin: right center;
      transition: transform 0.2s;
    }

    .interface-mini-selector:hover {
      transform: scale(0.93);
      border-color: #bdc1c6;
    }

    .mini-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #5f6368;
      white-space: nowrap;
      opacity: 0.9;
    }

    .custom-select-mini {
      background: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 0.5rem;
      padding: 0.4rem 2rem 0.4rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #202124;
      cursor: pointer;
      transition: all 0.2s;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235f6368' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
      background-repeat: no-repeat;
      background-position: right 0.6rem center;
      background-size: 14px;
      width: auto;
      min-width: 150px;
    }

    .custom-select-mini:hover {
      border-color: #bdc1c6;
      background-color: #f1f3f4;
    }

    .custom-select-mini:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }

    .status-text {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      text-align: center;
      color: #5f6368;
      background: #f8f9fa;
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 0.5rem;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    footer {
      text-align: center;
      padding: 1rem 2rem 1.5rem;
      font-size: 0.75rem;
      color: #80868b;
      border-top: 1px solid #e8eaed;
      margin-top: 0.2rem;
    }

    /* 移动端拦截遮罩层 */
    .mobile-blocker {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, #0b0f1c, #03060c);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
    }

    .blocker-card {
      background: rgba(20, 25, 40, 0.95);
      backdrop-filter: blur(16px);
      border-radius: 2.5rem;
      max-width: 90%;
      width: 460px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeInUp 0.4s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .blocker-icon {
      font-size: 4.5rem;
      margin-bottom: 1.2rem;
      display: inline-block;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    .blocker-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF, #A0B3FF);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.75rem;
    }

    .blocker-sub {
      font-size: 1rem;
      color: #cdd9ff;
      margin-bottom: 1.8rem;
      line-height: 1.4;
      font-weight: 500;
      opacity: 0.9;
    }

    .blocker-desc {
      font-size: 0.85rem;
      color: #9aa9cf;
      margin-bottom: 2rem;
      background: rgba(0,0,0,0.3);
      padding: 0.6rem 1rem;
      border-radius: 2rem;
      display: inline-block;
    }

    .blocker-note {
      font-size: 0.75rem;
      color: #6d7ba3;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 1.2rem;
      margin-top: 0.5rem;
    }

    @media (max-width: 680px) {
      .control-panel {
        padding: 1.2rem;
      }
      .hero h1 {
        font-size: 1.4rem;
      }
      .btn-primary {
        padding: 0.7rem 1.3rem;
      }
      .player-area {
        padding: 0 1rem 1.5rem;
      }
      .bottom-interface-area {
        justify-content: flex-end;
        padding-right: 0.2rem;
      }
      .interface-mini-selector {
        transform: scale(0.85);
        transform-origin: right center;
      }
      .custom-select-mini {
        min-width: 130px;
      }
    }
  </style>
</head>
<body>

<!-- 移动端拦截层 -->
<div id="mobileBlocker" class="mobile-blocker" style="display: none;">
  <div class="blocker-card">
    <div class="blocker-icon">🖥️⛔</div>
    <div class="blocker-title">仅限电脑端访问</div>

</div>

<!-- PC播放器容器 -->
<div class="player-container" id="playerContainer">

        <input type="text" id="videoUrl" class="url-input" placeholder="例如: https://v.qq.com/x/cover/xxx.html 或 搜索: 流浪地球2" value="">

          <option value="https://yparse.ik9.cc/index.php?url=">备用线路5</option>

    <div id="statusMessage" class="status-text">✨ 安全模式已启用 | 右键可复制粘贴 | 禁止调试</div>
  </div>
  <footer>⚡ 提示：解析接口来源于网络，仅供体验。如遇广告请忽略 · 请使用桌面设备访问 | 支持鼠标右键复制文字</footer>
</div>

<script>
  (function() {
    // ==================== 反调试模块 (打开调试直接退出) ====================
    let terminated = false;
    let debugDetectInterval = null;

    // 自杀函数：彻底清空页面，无法恢复
    function selfDestruct(reason = "检测到调试行为") {
      if (terminated) return;
      terminated = true;

      if (debugDetectInterval) clearInterval(debugDetectInterval);

      try {
        document.head.innerHTML = '';
        document.body.innerHTML = '';
        const newHtml = `
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>访问被拒绝</title><style>
            body { background: #0a0c12; color: #ff4d4d; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: monospace; margin:0; flex-direction:column; }
            h1 { font-size:2rem; margin-bottom:1rem; } p { opacity:0.9; } .code { margin-top:2rem; font-size:0.8rem; color:#888; }
          </style></head>
          <body>
            <h1>⚠️ 安全拦截</h1>
            <p>${reason}</p>
            <p>页面已永久禁止访问，请关闭开发者工具后刷新重试。</p>
            <div class="code">SECURITY_VIOLATION_DETECTED</div>
          </body>
          </html>
        `;
        document.write(newHtml);
        document.close();
      } catch(e) {}

      try {
        window.onload = null;
        window.onerror = null;
      } catch(e) {}

      throw new Error("Anti-debug triggered");
    }

    // 劫持 console 检测调用栈特征
    (function() {
      const originalConsole = window.console;
      if (originalConsole) {
        const methods = ['log', 'info', 'debug', 'warn', 'error', 'trace', 'dir', 'table', 'group', 'groupCollapsed'];
        methods.forEach(m => {
          if (originalConsole[m]) {
            try {
              originalConsole[m] = function(...args) {
                const stack = new Error().stack || '';
                if (stack.includes('eval') || stack.includes('console') || stack.includes('InjectedScript') || stack.includes('VM')) {
                  if (!terminated) selfDestruct("检测到开发者工具执行代码");
                }
              };
            } catch(e) {}
          }
        });
        if (originalConsole.clear) {
          originalConsole.clear = function() {
            if (!terminated) selfDestruct("检测到控制台清空行为");
          };
        }
      }
    })();

    // 时间差 debugger 检测
    function detectDebuggerByTiming() {
      const start = performance.now();
      const check = new Function('debugger; return performance.now();');
      const end = check();
      if ((end - start) > 50) {
        selfDestruct("检测到调试器断点");
      }
    }

    // 监听快捷键 (但保留 Ctrl+C / Ctrl+V / 右键菜单) —— 只拦截调试快捷键
    window.addEventListener('keydown', function(e) {
      if (terminated) return;
      // F12
      if (e.key === 'F12') {
        e.preventDefault();
        selfDestruct("禁止使用 F12");
        return false;
      }
      // Ctrl+Shift+I / J / C (审查元素/控制台)
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) {
        e.preventDefault();
        selfDestruct("检测到调试快捷键 (Ctrl+Shift+I/J/C)");
        return false;
      }
      // Ctrl+U 查看源代码
      if ((e.ctrlKey || e.metaKey) && e.key === 'u') {
        e.preventDefault();
        selfDestruct("禁止查看源代码");
        return false;
      }
      // Ctrl+Shift+K (Firefox)
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'K') {
        e.preventDefault();
        selfDestruct("检测到开发者工具快捷键");
        return false;
      }
      // 单独 Ctrl+F12
      if (e.ctrlKey && e.key === 'F12') {
        e.preventDefault();
        selfDestruct("禁止调试组合键");
      }
    });

    // 注意：我们不拦截 contextmenu 事件！保证右键菜单完全可用（复制/粘贴/剪切等）
    // 同时保留正常的文本选择功能，不加 user-select:none 全局。

    // 检测窗口尺寸差异（devtools 侧边栏）
    function detectDevToolsBySize() {
      const widthDiff = window.outerWidth - window.innerWidth;
      const heightDiff = window.outerHeight - window.innerHeight;
      if ((widthDiff > 130) || (heightDiff > 130)) {
        selfDestruct("检测到开发者工具窗口侧边栏");
      }
    }

    // Object 属性访问检测 devtools
    let devtoolDetected = false;
    const dummyElement = new Image();
    Object.defineProperty(dummyElement, 'id', {
      get: function() {
        if (!terminated && !devtoolDetected) {
          devtoolDetected = true;
          selfDestruct("检测到控制台访问对象属性");
        }
        return '';
      }
    });

    setInterval(() => {
      if (terminated) return;
      try {
        console.log(dummyElement);
        detectDevToolsBySize();
        detectDebuggerByTiming();
      } catch(e) {}
    }, 400);

    // 密集debugger检测
    setInterval(() => {
      if (terminated) return;
      const t1 = Date.now();
      try {
        const check = new Function('try { debugger; } catch(e) {} return Date.now();');
        const t2 = check();
        if (t2 - t1 > 80) {
          selfDestruct("调试器主动断点检测");
        }
      } catch(e) {}
    }, 500);

    setInterval(() => {
      if (terminated) return;
      const before = new Date();
      debugger;
      const after = new Date();
      if (after - before > 100) {
        selfDestruct("检测到调试器附加");
      }
    }, 700);

    // 干扰 alert/confirm/prompt
    window.alert = function() {};
    window.confirm = function() { return false; };
    window.prompt = function() { return null; };

    // 防止外部属性访问触发
    Object.defineProperty(window, 'devtools', {
      get: function() { selfDestruct("非法访问 devtools 属性"); }
    });

    // ==================== UA检测（仅限PC） ====================
    function isMobileDevice() {
      const ua = navigator.userAgent;
      const mobileRegex = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile|Tablet|PlayBook|Silk/i;
      const isIPad = /iPad/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
      const isAndroidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);
      const isSmallTouch = /Touch/i.test(ua) && window.innerWidth <= 1024;
      return mobileRegex.test(ua) || isIPad || isAndroidTablet || isSmallTouch;
    }

    const isMobile = isMobileDevice();
    const blocker = document.getElementById('mobileBlocker');
    const playerContainer = document.getElementById('playerContainer');

    if (isMobile) {
      if (blocker) blocker.style.display = 'flex';
      if (playerContainer) {
        playerContainer.style.opacity = '0.2';
        playerContainer.style.pointerEvents = 'none';
      }
      const frame = document.getElementById('videoFrame');
      if (frame) frame.src = 'about:blank';
      const interactive = document.querySelectorAll('#videoUrl, #playBtn, #jk, .example-badge, .custom-select-mini');
      interactive.forEach(el => { if(el) { el.disabled = true; el.style.pointerEvents = 'none'; el.style.opacity = '0.5'; if(el.tagName === 'INPUT') el.readOnly = true; } });
      const statusMsg = document.getElementById('statusMessage');
      if (statusMsg) { statusMsg.innerHTML = '🚫 访问受限：请使用电脑端浏览器访问'; statusMsg.style.background = '#fce8e6'; statusMsg.style.color = '#c5221f'; }
      return;
    }

    // PC端授权
    if (playerContainer) { playerContainer.style.opacity = '1'; playerContainer.style.pointerEvents = 'auto'; }

    // 恢复所有输入框启用 (尤其是 readOnly 防干扰)
    const urlInputField = document.getElementById('videoUrl');
    if (urlInputField) {
      urlInputField.readOnly = false;
      urlInputField.disabled = false;
    }
    const playButton = document.getElementById('playBtn');
    if (playButton) playButton.disabled = false;
    const selectApi = document.getElementById('jk');
    if (selectApi) selectApi.disabled = false;

    // ==================== 播放器正常功能 ====================
    const selectEl = document.getElementById('jk');
    const videoUrlInput = document.getElementById('videoUrl');
    const playBtn = document.getElementById('playBtn');
    const videoFrame = document.getElementById('videoFrame');
    const statusDiv = document.getElementById('statusMessage');

    function setStatus(msg, isErr = false) {
      if (terminated) return;
      statusDiv.innerHTML = msg;
      statusDiv.style.color = isErr ? '#d93025' : '#5f6368';
      statusDiv.style.background = isErr ? '#fce8e6' : '#f8f9fa';
    }

    function buildAndPlay() {
      if (terminated) return;
      let iface = selectEl.value;
      let input = videoUrlInput.value.trim();
      if (!input) { setStatus('❓ 请输入链接或片名', true); return; }
      if (iface.startsWith('//')) iface = location.protocol + iface;
      const fullUrl = iface + encodeURIComponent(input);
      try { new URL(fullUrl); } catch(e) { setStatus('❌ 地址无效', true); return; }
      setStatus(`⏳ 通过「${selectEl.options[selectEl.selectedIndex]?.text}」加载...`);
      videoFrame.src = fullUrl;
      videoFrame.onload = () => setStatus(`✅ 解析地址已加载，请等待视频响应`, false);
      videoFrame.onerror = () => setStatus(`⚠️ 加载失败，可尝试切换接口`, true);
    }

    playBtn.addEventListener('click', buildAndPlay);
    videoUrlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') buildAndPlay(); });
    selectEl.addEventListener('change', () => setStatus(`🔁 已切换至 ${selectEl.options[selectEl.selectedIndex]?.text} 接口`, false));

    document.querySelectorAll('.example-badge[data-url]').forEach(b => {
      b.addEventListener('click', () => {
        videoUrlInput.value = b.getAttribute('data-url');
        setStatus(`已填充示例: ${b.innerText}`, false);
      });
    });

    setStatus('✅ 电脑端已授权 | 安全防护开启 (调试即退出) | 支持右键复制粘贴');
  })();
</script>
</body>
</html>
